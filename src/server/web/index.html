<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OfferPilot — AI Interview Diagnosis Agent</title>
  <link rel="icon" href="brand/offerpilot-favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="brand/offerpilot-icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" href="brand/offerpilot-icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark">OP</span>
        <span class="brand-name">OfferPilot</span>
      </div>
      <div class="topbar-right">
        <div class="topbar-toolbar">
          <button class="model-btn" id="modelBtn" type="button">
            <span id="modelLabel">deepseek-v4-flash</span>
            <span class="caret">▾</span>
          </button>
          <a class="login-btn" id="auth-link" href="/login">登录</a>
          <div class="model-menu hidden" id="modelMenu"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- 主体布局：左侧 sidebar + 聊天主区 -->
  <main class="layout">
    <!-- 左侧 sidebar：会话记录 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">会话记录</span>
        <button class="sidebar-close" id="sidebarClose" type="button" aria-label="收起侧边栏" title="收起会话记录">›</button>
      </div>

      <button class="new-chat-btn" id="newChatBtnTop" type="button">
        <span class="plus">+</span><span>开启新对话</span>
      </button>

      <nav class="session-groups" id="sessionGroups">
        <!-- 由 JS 渲染：分组 + 列表 -->
      </nav>

      <div class="sidebar-foot">
        <div class="sidebar-foot-meta" id="sessionCount">0 个会话</div>
      </div>
    </aside>

    <!-- 折叠状态下的展开按钮（左侧） -->
    <button class="sidebar-toggle hidden" id="sidebarToggle" type="button" aria-label="展开会话记录" title="展开会话记录">‹</button>

    <!-- 右侧聊天主区 -->
    <section class="main">
      <!-- welcome 页面 -->
      <div class="welcome" id="welcome">
        <h1 class="welcome-title">开始新的面试准备</h1>
        <p class="welcome-sub">我是 OfferPilot，你的 AI 面试诊断官。可以协助模拟面试、诊断答案、分析 JD 与优化简历。</p>
        <div class="chips">
          <button class="chip" data-prompt="我想准备 P6 级别的 AI Agent 工程师面试，请帮我梳理常见考点">AI Agent 工程师面试准备</button>
          <button class="chip" data-prompt="帮我做一次模拟面试，重点考察 RAG 系统设计能力">RAG 系统设计模拟面试</button>
          <button class="chip" data-prompt="请帮我分析下面这份 JD 并列出候选人应重点准备的内容">[粘贴 JD] 分析 JD</button>
          <button class="chip" data-prompt="请评估我的项目经历描述是否满足 STAR 结构">简历 STAR 结构诊断</button>
          <button class="chip" data-prompt="我刚做完一道 ReAct 模式的题，请你帮我评分并对比高手的答案">ReAct 题目诊断</button>
        </div>
      </div>

      <!-- 聊天主区域 -->
      <div class="chat hidden" id="chat"></div>

      <!-- 用户主页视图（雷达 / 简历诊断 / JD匹配） -->
      <div class="radar-view hidden" id="radarView">
        <div class="radar-scroll">
          <div class="radar-head">
            <button class="radar-back" id="radarBack" type="button"><span>←</span> 返回对话</button>
            <h2 class="radar-title" id="radarTitle">能力雷达</h2>
            <button class="radar-refresh hidden" id="radarRefresh" type="button" title="刷新数据">⟳</button>
          </div>

          <div class="radar-tabs" id="radarTabs">
            <button class="radar-tab active" data-tab="radar">能力雷达</button>
            <button class="radar-tab" data-tab="resume">简历诊断</button>
            <button class="radar-tab" data-tab="match">JD匹配</button>
          </div>

          <!-- 能力雷达面板 -->
          <div class="radar-panel" id="panelRadar">
            <div class="radar-stats">
              <div class="stat-card">
                <div class="stat-label"><span class="stat-icon si-blue"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg></span>平均分</div>
                <div class="stat-value" id="statAvg">0<span class="stat-unit">/10</span></div>
              </div>
              <div class="stat-card">
                <div class="stat-label"><span class="stat-icon si-green"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg></span>已诊断</div>
                <div class="stat-value" id="statTotal">0<span class="stat-unit">题</span></div>
              </div>
              <div class="stat-card">
                <div class="stat-label"><span class="stat-icon si-amber"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></span>薄弱项</div>
                <div class="stat-value" id="statWeak">0<span class="stat-unit">个</span></div>
              </div>
              <div class="stat-card">
                <div class="stat-label"><span class="stat-icon si-purple"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg></span>总分</div>
                <div class="stat-value" id="statSum">0<span class="stat-unit">/70</span></div>
              </div>
            </div>

            <div class="radar-grid">
              <div class="radar-card">
                <div class="radar-card-title">能力雷达图</div>
                <div class="radar-card-sub">7 维度面试能力评估</div>
                <div class="radar-canvas-wrap"><canvas id="radarCanvas" width="440" height="380"></canvas></div>
              </div>
              <div class="radar-card">
                <div class="radar-card-title">维度详情</div>
                <div class="radar-card-sub">各维度得分与建议</div>
                <div class="dim-list" id="dimList"></div>
                <div class="readiness">
                  <span class="readiness-label">面试准备度</span>
                  <div class="readiness-bar"><div class="readiness-fill" id="readinessFill"></div></div>
                  <span class="readiness-value" id="readinessValue">0%</span>
                </div>
              </div>
            </div>

            <div class="radar-card learn-card">
              <div class="radar-card-title">学习路径推荐</div>
              <div class="radar-card-sub">根据薄弱维度自动生成，完成后重新诊断更新</div>
              <div class="learn-grid" id="learnGrid"></div>
            </div>
          </div>

          <!-- 简历诊断面板 -->
          <div class="radar-panel hidden" id="panelResume">
            <div class="radar-card">
              <div class="radar-card-title">简历文本</div>
              <div class="radar-card-sub">粘贴简历全文或上传文件，系统将按段落分析并给出诊断建议</div>
              <div class="upload-row">
                <input type="file" class="upload-input" id="resumeFileInput" accept=".pdf,.docx,.doc,.txt,.md,.tex" />
                <button class="btn-secondary btn-sm" id="resumeUploadBtn" type="button">📄 上传文件</button>
                <span class="tool-status" id="resumeUploadStatus"></span>
              </div>
              <textarea class="tool-textarea" id="resumeInput" placeholder="在此粘贴简历内容&#10;&#10;支持 Markdown 格式，以 # 标题分隔段落。&#10;例如：&#10;# 个人信息&#10;张三 | 5年 Golang 开发经验&#10;&#10;# 工作经历&#10;主导了某 Agent 系统从 0 到 1 的搭建..."></textarea>
              <div class="tool-actions">
                <button class="btn-primary" id="resumeDiagnoseBtn" type="button">多模态诊断</button>
                <button class="btn-secondary" id="resumeAIBtn" type="button">简历模拟面试</button>
                <span class="tool-status" id="resumeStatus"></span>
              </div>
              <div class="tool-results" id="resumeResults"></div>
            </div>
          </div>

          <!-- JD匹配面板 -->
          <div class="radar-panel hidden" id="panelMatch">
            <div class="match-grid">
              <div class="radar-card">
                <div class="radar-card-title">职位描述 (JD)</div>
                <div class="radar-card-sub">粘贴目标岗位的职位描述或上传文件</div>
                <div class="upload-row">
                  <input type="file" class="upload-input" id="jdFileInput" accept=".pdf,.docx,.doc,.txt,.md,.tex" />
                  <button class="btn-secondary btn-sm" id="jdUploadBtn" type="button">📄 上传文件</button>
                  <span class="tool-status" id="jdUploadStatus"></span>
                </div>
                <textarea class="tool-textarea" id="jdInput" placeholder="在此粘贴 JD 内容&#10;&#10;例如：&#10;【岗位职责】&#10;1. 负责 AI Agent 系统的架构设计与开发&#10;2. 优化 RAG 检索链路...&#10;&#10;【任职要求】&#10;- 5年以上后端开发经验&#10;- 精通 Golang 或 Python..."></textarea>
              </div>
              <div class="radar-card">
                <div class="radar-card-title">我的简历</div>
                <div class="radar-card-sub">粘贴你的简历内容或上传文件</div>
                <div class="upload-row">
                  <input type="file" class="upload-input" id="matchResumeFileInput" accept=".pdf,.docx,.doc,.txt,.md,.tex" />
                  <button class="btn-secondary btn-sm" id="matchResumeUploadBtn" type="button">📄 上传文件</button>
                  <span class="tool-status" id="matchResumeUploadStatus"></span>
                </div>
                <textarea class="tool-textarea" id="matchResumeInput" placeholder="在此粘贴简历内容&#10;&#10;与 JD 进行匹配分析..."></textarea>
              </div>
            </div>
            <div class="tool-actions">
              <button class="btn-primary" id="matchBtn" type="button">规则匹配</button>
              <button class="btn-secondary" id="matchAIBtn" type="button">🤖 AI 匹配</button>
              <span class="tool-status" id="matchStatus"></span>
            </div>
            <div class="tool-results" id="matchResults"></div>
          </div>
        </div>
      </div>

      <!-- 底部 dock：会话历史 + composer -->
      <div class="dock">
        <!-- 底部历史 chips -->
        <div class="sessions-bar hidden" id="sessionsBar">
          <button class="last-session hidden" id="lastSession" type="button"></button>
          <div class="history-chips" id="historyChips"></div>
          <button class="new-session-btn hidden" id="newSessionBtn" type="button">
            <span class="plus">+</span>
            <span>新会话</span>
          </button>
        </div>

        <!-- 输入框 -->
        <form class="composer" id="composer" autocomplete="off">
          <input type="file" class="upload-input" id="chatFileInput" accept=".pdf,.docx,.doc,.txt,.md,.tex" />
          <div class="composer-body">
            <div class="file-chips" id="fileChips"></div>
            <div class="composer-row">
              <button class="upload-btn" id="uploadBtn" type="button" aria-label="上传文件" title="上传简历或JD文件">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              </button>
              <textarea id="input" placeholder="向 OfferPilot 提问，例如：帮我出一道 AI Agent 方向的模拟面试题" rows="1"></textarea>
              <button class="send-btn" id="sendBtn" type="submit" aria-label="发送">
                <span class="send-arrow">↑</span>
              </button>
            </div>
          </div>
        </form>
        <div class="dock-foot">内容由 AI 生成，仅供参考，请仔细甄别</div>
      </div>
    </section>
  </main>

  <script src="script.js" defer></script>
  <script>
    // 登录状态监测
    (function(){
      var user=null;
      var el=document.getElementById('auth-link');
      function apply(){
        if(!el) return;
        if(user && user.username){
          el.textContent=user.username;
          el.title='已登录';
        }else{
          el.textContent='登录';
          el.title='';
        }
      }
      fetch('/api/me',{credentials:'include'}).then(function(r){if(r.ok)return r.json();return null;}).then(function(d){if(d&&d.username){user=d;}apply();}).catch(function(){});
      setInterval(apply,2000);
    })();
  </script>
</body>
</html>
