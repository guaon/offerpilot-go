name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: 构建
        run: go build ./...

      - name: 静态检查
        run: go vet ./...

      - name: 测试
        run: go test ./...
